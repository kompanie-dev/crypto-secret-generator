<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Crypto Secret Generator</title>
        <style>
            :root {
                --background-color: #111;
                --border-color: #333;
                --primary-color: #85c;
                --surface-color: #222;
                --text-color: #eee;
                color-scheme: dark;
            }

            body {
                align-items: center;
                background: var(--background-color);
                color: var(--text-color);
                display: flex;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                flex-direction: column;
                margin: 0;
                min-height: 100vh;
                padding: 20px;
            }

            button {
                background: var(--border-color);
                border: 1px solid var(--border-color);
                border-radius: 4px;
                color: var(--text-color);
                cursor: pointer;
                padding: 8px;
                transition:
                    background 0.2s,
                    border-color 0.2s;
            }

            h1 {
                color: var(--primary-color);
                font-size: 24px;
                margin-bottom: 30px;
            }

            button:focus-visible,
            input[type="checkbox"]:focus-visible {
                outline: 2px solid var(--primary-color);
                outline-offset: 2px;
            }

            input:not([type="checkbox"]):focus {
                border-color: var(--primary-color);
                outline: none;
            }

            input:not([type="checkbox"]) {
                background: var(--background-color);
                border: 1px solid var(--border-color);
                border-radius: 4px;
                box-sizing: border-box;
                color: var(--text-color);
                font: 18px monospace;
                padding: 8px;
                width: 100%;
            }

            input[type="checkbox"] {
                margin-right: 8px;
                padding: 0;
                vertical-align: middle;
                width: auto;
            }

            label {
                display: block;
                font-weight: 500;
                margin-top: 12px;
            }

            .container {
                background: var(--surface-color);
                border: 1px solid var(--border-color);
                border-radius: 8px;
                max-width: 500px;
                padding: 20px;
                width: 100%;
            }

            .entropy-display {
                color: #aaa;
                font-size: 14px;
                margin: 10px 0 0 0;
            }

            .secret-row {
                align-items: center;
                display: flex;
                gap: 8px;
                margin-bottom: 10px;
            }

            .copy-button {
                flex-shrink: 0;
                width: 75px;
            }

            .generate-button {
                background: var(--primary-color);
                border-color: var(--primary-color);
                width: 100%;
            }

            .secret-input {
                flex: 1;
                min-width: 0;
                text-align: center;
            }

            .show-secret-button {
                align-items: center;
                background: none;
                border: none;
                color: var(--text-color);
                display: inline-flex;
                flex-shrink: 0;
                height: 40px;
                justify-content: center;
                padding: 0;
                width: 40px;
            }

            .show-secret-button .icon-eye-off {
                display: none;
            }

            .show-secret-button[aria-pressed="true"] .icon-eye {
                display: none;
            }

            .show-secret-button[aria-pressed="true"] .icon-eye-off {
                display: block;
            }

            /* Mask the secret without password-field semantics, which
               password managers detect and offer to save. */
            .secret-input:not(.revealed) {
                -webkit-text-security: disc;
            }
        </style>
    </head>
    <body>
        <h1>Crypto Secret Generator</h1>
        <div class="container">
            <div class="secret-row">
                <button
                    id="show-secret-button"
                    class="show-secret-button"
                    aria-pressed="false"
                    aria-label="Show secret"
                >
                    <svg
                        class="icon-eye"
                        viewBox="0 0 24 24"
                        width="20"
                        height="20"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg
                        class="icon-eye-off"
                        viewBox="0 0 24 24"
                        width="20"
                        height="20"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                        <line x1="1" y1="1" x2="23" y2="23" />
                    </svg>
                </button>
                <input id="secret-input" class="secret-input" type="text" aria-label="Generated secret" autocomplete="off" spellcheck="false" />
                <button
                    id="copy-button"
                    class="copy-button"
                    aria-live="polite"
                    title="Copy the generated secret to the clipboard."
                >
                    Copy
                </button>
            </div>

            <button id="generate-button" class="generate-button">Generate</button>

            <div>
                <label>
                    <input type="checkbox" id="uppercase-first-block" />
                    Uppercase first block
                </label>

                <label>
                    Block Length:
                    <input
                        type="number"
                        id="block-length"
                        min="1"
                        max="10"
                        value="6"
                        autocomplete="off"
                    />
                </label>

                <label>
                    Block Count:
                    <input
                        type="number"
                        id="block-count"
                        min="1"
                        max="10"
                        value="3"
                        autocomplete="off"
                    />
                </label>

                <label>
                    Allowed Characters:
                    <input
                        type="text"
                        id="allowed-chars"
                        value="abcdefghijklmnopqrstuvwxyz0123456789"
                        placeholder="Enter allowed characters"
                        autocomplete="off"
                    />
                </label>

                <p>
                    <button id="preset-letters-numbers">
                        Letters + Numbers
                    </button>
                    <button id="preset-letters">Letters</button>
                    <button id="preset-numbers">Numbers</button>
                </p>
            </div>

            <p class="entropy-display">
                Entropy: <strong id="entropy-value">-</strong> bits
            </p>
        </div>

        <script>
            const generateButton = document.getElementById("generate-button");
            const blockLengthInput = document.getElementById("block-length");
            const blockCountInput = document.getElementById("block-count");
            const presetLettersNumbers = document.getElementById(
                "preset-letters-numbers",
            );
            const presetLetters = document.getElementById("preset-letters");
            const presetNumbers = document.getElementById("preset-numbers");
            const copyButton = document.getElementById("copy-button");
            const showSecretButton = document.getElementById(
                "show-secret-button",
            );
            const entropyValueElement = document.getElementById("entropy-value");
            const secretInput = document.getElementById("secret-input");
            const allowedCharactersInput =
                document.getElementById("allowed-chars");
            const uppercaseFirstBlockCheckbox = document.getElementById(
                "uppercase-first-block",
            );
            const inputs = document.querySelectorAll("input:not(#secret-input)");

            let copyButtonTimeoutId;

            function generateCryptoRandomString(length, allowedCharacters) {
                const alphabetSize = allowedCharacters.length;
                if (alphabetSize === 0) {
                    return "";
                }

                const limit = Math.floor(0x100000000 / alphabetSize) * alphabetSize;
                let result = "";
                let generatedCount = 0;

                while (generatedCount < length) {
                    const values = new Uint32Array(length - generatedCount);
                    crypto.getRandomValues(values);

                    for (let i = 0; i < values.length && generatedCount < length; i++) {
                        if (values[i] < limit) {
                            result += allowedCharacters[values[i] % alphabetSize];
                            generatedCount++;
                        }
                    }
                }

                return result;
            }

            function generateSecret(
                blockLength,
                blockCount,
                firstBlockAllowedCharacters,
                allowedCharacters,
            ) {
                let secret = "";

                for (let i = 0; i < blockCount; i++) {
                    secret += generateCryptoRandomString(
                        blockLength,
                        i === 0 ? firstBlockAllowedCharacters : allowedCharacters,
                    );

                    if (i < blockCount - 1) {
                        secret += "-";
                    }
                }

                return secret;
            }

            function calculateEntropy(
                blockLength,
                blockCount,
                firstBlockAlphabetSize,
                alphabetSize,
            ) {
                return (
                    blockLength *
                    (Math.log2(firstBlockAlphabetSize) +
                        (blockCount - 1) * Math.log2(alphabetSize))
                );
            }

            async function copySecret() {
                try {
                    await navigator.clipboard.writeText(secretInput.value);
                    setCopyButtonText("Copied!");
                }
                catch {
                    setCopyButtonText("Failed!");
                }
            }

            function setCopyButtonText(text) {
                copyButton.textContent = text;

                clearTimeout(copyButtonTimeoutId);
                copyButtonTimeoutId = setTimeout(() => {
                    copyButton.textContent = "Copy";
                }, 2000);
            }

            function dedupeCharacters(characters) {
                return [...new Set(characters)];
            }

            function isNumberInputCleared(input) {
                return Number.isNaN(input.valueAsNumber);
            }

            function clampNumberInputValue(input) {
                const clampedValue = Math.min(
                    Math.max(input.valueAsNumber, Number(input.min)),
                    Number(input.max),
                );

                if (input.valueAsNumber !== clampedValue) {
                    input.value = String(clampedValue);
                }

                return clampedValue;
            }

            function generateAndDisplaySecret() {
                const allowedCharacters = dedupeCharacters(allowedCharactersInput.value);

                if (allowedCharacters.length === 0) {
                    secretInput.value = "";
                    entropyValueElement.textContent = "0";
                    return;
                }

                // A cleared number field is mid-edit; keep the previous secret
                // instead of regenerating at the fallback length.
                if (
                    isNumberInputCleared(blockLengthInput) ||
                    isNumberInputCleared(blockCountInput)
                ) {
                    return;
                }

                const blockLength = clampNumberInputValue(blockLengthInput);
                const blockCount = clampNumberInputValue(blockCountInput);
                const firstBlockAllowedCharacters = uppercaseFirstBlockCheckbox.checked
                    ? dedupeCharacters(allowedCharacters.map((c) => c.toUpperCase()))
                    : allowedCharacters;

                secretInput.value = generateSecret(
                    blockLength,
                    blockCount,
                    firstBlockAllowedCharacters,
                    allowedCharacters,
                );

                entropyValueElement.textContent = calculateEntropy(
                    blockLength,
                    blockCount,
                    firstBlockAllowedCharacters.length,
                    allowedCharacters.length,
                ).toFixed(1);
            }

            function setGenerationParameters(
                blockLength,
                blockCount,
                allowedCharacters,
            ) {
                allowedCharactersInput.value = allowedCharacters;
                blockLengthInput.value = blockLength;
                blockCountInput.value = blockCount;

                generateAndDisplaySecret();
            }

            generateButton.addEventListener("click", generateAndDisplaySecret);
            presetLetters.addEventListener("click", () => {
                setGenerationParameters(6, 1, "abcdefghijklmnopqrstuvwxyz");
            });
            presetLettersNumbers.addEventListener("click", () => {
                setGenerationParameters(
                    6,
                    3,
                    "abcdefghijklmnopqrstuvwxyz0123456789",
                );
            });
            presetNumbers.addEventListener("click", () => {
                setGenerationParameters(6, 1, "0123456789");
            });
            copyButton.addEventListener("click", copySecret);
            showSecretButton.addEventListener("click", () => {
                const isRevealed = secretInput.classList.toggle("revealed");
                showSecretButton.setAttribute(
                    "aria-pressed",
                    String(isRevealed),
                );
                showSecretButton.setAttribute(
                    "aria-label",
                    isRevealed ? "Hide secret" : "Show secret",
                );
            });

            for (const input of inputs) {
                input.addEventListener("input", generateAndDisplaySecret);
            }

            for (const input of [blockLengthInput, blockCountInput]) {
                input.addEventListener("blur", () => {
                    if (isNumberInputCleared(input)) {
                        input.value = input.min;
                        generateAndDisplaySecret();
                    }
                });
            }

            allowedCharactersInput.addEventListener("blur", () => {
                const normalized = dedupeCharacters(allowedCharactersInput.value).join("");
                if (normalized !== allowedCharactersInput.value) {
                    allowedCharactersInput.value = normalized;
                }
            });

            generateAndDisplaySecret();
        </script>
    </body>
</html>
